# Disposable CI profile, not the unmeasured production VM envelope.
listeners.tcp.default = 5672
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/test-certs/ca.pem
ssl_options.certfile = /etc/rabbitmq/test-certs/server.pem
ssl_options.keyfile = /etc/rabbitmq/test-certs/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
management.tcp.port = 15672
management.ssl.port = 15671
management.ssl.cacertfile = /etc/rabbitmq/test-certs/ca.pem
management.ssl.certfile = /etc/rabbitmq/test-certs/server.pem
management.ssl.keyfile = /etc/rabbitmq/test-certs/server.key
channel_max = 32
max_message_size = 65536
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 256MiB
