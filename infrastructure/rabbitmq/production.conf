# Production broker: TLS only, private to the Compose network. Unmeasured envelope.
# Users, permissions and topology come from the definitions secret at boot.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile = /run/secrets/rabbitmq-tls.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
management.ssl.port = 15671
management.ssl.cacertfile = /etc/rabbitmq/tls/ca.pem
management.ssl.certfile = /etc/rabbitmq/tls/server.pem
management.ssl.keyfile = /run/secrets/rabbitmq-tls.key
load_definitions = /run/secrets/rabbitmq-definitions.json
channel_max = 32
max_message_size = 65536
vm_memory_high_watermark.absolute = 384MiB
disk_free_limit.absolute = 1GiB
