name: Independent runtime contracts
on:
  pull_request:
    paths:
      - 'services/runtime/**'
      - 'config/runtime/**'
      - 'infrastructure/migrations/**'
      - 'infrastructure/rabbitmq/**'
      - 'infrastructure/compose.m0-replay-test.yml'
      - 'infrastructure/compose.m0-test.yml'
      - '.github/workflows/runtime-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'services/runtime/**'
      - 'config/runtime/**'
      - 'infrastructure/migrations/**'
      - 'infrastructure/rabbitmq/**'
      - 'infrastructure/compose.m0-replay-test.yml'
      - 'infrastructure/compose.m0-test.yml'
      - '.github/workflows/runtime-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      MARKOS_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres password=synthetic-test-only
      MARKOS_REQUIRE_DB_TESTS: '1'
      MARKOS_TEST_RABBIT_HTTP: http://127.0.0.1:15672
      MARKOS_TEST_AMQP_BASE: amqp://127.0.0.1:5672
      MARKOS_TEST_RABBIT_USER: m0c-admin
      MARKOS_TEST_RABBIT_PASSWORD: synthetic-test-only
      MARKOS_REQUIRE_RABBIT_TESTS: '1'
    services:
      rabbitmq:
        image: rabbitmq:4.4.0-management@sha256:7ddb7fd4630026bc84f72760f33629e8c1ef3bb106360fb385fae0dd4ef886f3
        env:
          RABBITMQ_DEFAULT_USER: m0c-admin
          RABBITMQ_DEFAULT_PASS: synthetic-test-only
          RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit channel_max 32 -rabbit max_message_size 65536
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.14'
      - name: Select isolated runtime environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/markos-runtime-dev" >> "$GITHUB_ENV"
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest --ignore=tests/control_api --ignore=tests/browser --ignore=tests/integration/test_volume_loss.py --ignore=tests/integration/test_lifecycle_harness.py
      - run: uv run --no-sync python -m markos_runtime.schemas --output-dir ../../config/runtime/schemas
      - name: Verify standalone wheel outside checkout
        run: |
          uv build --out-dir "$RUNNER_TEMP/runtime-wheel"
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime-dependencies.txt"
          uv venv --python 3.13.14 "$RUNNER_TEMP/runtime-clean"
          uv pip install --python "$RUNNER_TEMP/runtime-clean/bin/python" --require-hashes -r "$RUNNER_TEMP/runtime-dependencies.txt"
          uv pip install --python "$RUNNER_TEMP/runtime-clean/bin/python" --no-deps "$RUNNER_TEMP/runtime-wheel/markos_runtime-0.1.0-py3-none-any.whl"
          "$RUNNER_TEMP/runtime-clean/bin/markos-control" --help
          "$RUNNER_TEMP/runtime-clean/bin/python" -I -c 'from importlib.resources import files; root=files("markos_runtime.web").joinpath("assets"); assert all(root.joinpath(name).read_bytes() for name in ("shell.html", "app.js", "app.css"))'
          cp -R ../../config/runtime "$RUNNER_TEMP/runtime-examples"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/runtime-clean/bin/python" -I -c 'import importlib.util; assert importlib.util.find_spec("markos") is None; assert importlib.util.find_spec("duckdb") is None; assert importlib.util.find_spec("pytest") is None'
          "$RUNNER_TEMP/runtime-clean/bin/python" -I -m markos_runtime preflight --config runtime-examples/runtime.example.toml --event runtime-examples/noop.example.json
          "$RUNNER_TEMP/runtime-clean/bin/python" -I -m markos_runtime preflight-control --config runtime-examples/control/config.example.json --event runtime-examples/control/chat-event.example.json

  control-profile:
    name: Optional control profile compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.14'
      - run: python -m pip install uv==0.13.6
      - run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/markos-control-profile" >> "$GITHUB_ENV"
      - run: uv sync --project services/runtime --locked --extra control --no-dev
      - name: Verify ASGI, signed-token and template primitives without networking
        working-directory: services/runtime
        run: uv run --no-sync python scripts/check_control_profile.py

  control-api:
    name: Authenticated shared API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MARKOS_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres password=synthetic-test-only
      MARKOS_REQUIRE_DB_TESTS: '1'
      MARKOS_REQUIRE_API_TESTS: '1'
      MARKOS_REQUIRE_BROWSER_TESTS: '1'
      PLAYWRIGHT_BROWSERS_PATH: /tmp/markos-ci-browsers
      MARKOS_TEST_RABBIT_HTTP: http://127.0.0.1:15672
      MARKOS_TEST_AMQP_BASE: amqp://127.0.0.1:5672
      MARKOS_TEST_RABBIT_USER: m0c-admin
      MARKOS_TEST_RABBIT_PASSWORD: synthetic-test-only
      MARKOS_REQUIRE_RABBIT_TESTS: '1'
    services:
      rabbitmq:
        image: rabbitmq:4.4.0-management@sha256:7ddb7fd4630026bc84f72760f33629e8c1ef3bb106360fb385fae0dd4ef886f3
        env:
          RABBITMQ_DEFAULT_USER: m0c-admin
          RABBITMQ_DEFAULT_PASS: synthetic-test-only
          RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit channel_max 32 -rabbit max_message_size 65536
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.14'
      - run: python -m pip install uv==0.13.6
      - run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/markos-control-api" >> "$GITHUB_ENV"
      - run: uv sync --project services/runtime --locked --extra control --group browser
      - working-directory: services/runtime
        run: uv run --no-sync mypy
      - working-directory: services/runtime
        run: uv run --no-sync pytest -q tests/control_api
      - name: Install pinned disposable Chromium
        working-directory: services/runtime
        run: uv run --no-sync python -m playwright install --with-deps chromium --only-shell
      - name: Browser web and CLI acceptance
        working-directory: services/runtime
        run: uv run --no-sync pytest -q tests/browser

  replay-volume-loss:
    name: Broker volume-loss recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MARKOS_TEST_COMPOSE_PROJECT: markos-m0e-${{ github.run_id }}-${{ github.run_attempt }}
      MARKOS_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres password=synthetic-test-only
      MARKOS_REQUIRE_DB_TESTS: '1'
      MARKOS_TEST_RABBIT_HTTP: http://127.0.0.1:15672
      MARKOS_TEST_AMQP_BASE: amqp://127.0.0.1:5672
      MARKOS_TEST_RABBIT_USER: m0c-admin
      MARKOS_TEST_RABBIT_PASSWORD: synthetic-test-only
      MARKOS_REQUIRE_RABBIT_TESTS: '1'
      MARKOS_REQUIRE_VOLUME_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.14'
      - run: python -m pip install uv==0.13.6
      - run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/markos-volume-test" >> "$GITHUB_ENV"
      - run: uv sync --project services/runtime --locked
      - name: Start disposable synthetic dependencies
        run: docker compose -p "$MARKOS_TEST_COMPOSE_PROJECT" -f infrastructure/compose.m0-replay-test.yml up -d --wait --wait-timeout 120
      - name: Delete broker volume and recover confirmed work
        working-directory: services/runtime
        run: uv run --no-sync pytest -q tests/integration/test_volume_loss.py
      - name: Remove only this test project and volumes
        if: always()
        run: docker compose -p "$MARKOS_TEST_COMPOSE_PROJECT" -f infrastructure/compose.m0-replay-test.yml down -v --remove-orphans

  lifecycle:
    name: Synthetic lifecycle and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MARKOS_TEST_COMPOSE_PROJECT: markos-m0f-${{ github.run_id }}-${{ github.run_attempt }}
      MARKOS_REQUIRE_LIFECYCLE_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.14'
      - run: python -m pip install uv==0.13.6
      - run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/markos-lifecycle-test" >> "$GITHUB_ENV"
      - run: uv sync --project services/runtime --locked
      - name: Generate disposable test CA
        working-directory: services/runtime
        run: uv run --no-sync python -m tests.lifecycle_support certs
      - name: Start isolated dependencies
        run: docker compose -p "$MARKOS_TEST_COMPOSE_PROJECT" -f infrastructure/compose.m0-test.yml up -d --wait --wait-timeout 120 postgres rabbitmq
      - name: Explicit synthetic provisioning and migration
        working-directory: services/runtime
        run: uv run --no-sync python -m tests.lifecycle_support bootstrap
      - name: Build only independent runtime
        run: docker compose -p "$MARKOS_TEST_COMPOSE_PROJECT" -f infrastructure/compose.m0-test.yml build publisher
      - name: Verify strict test TLS before roles
        run: |
          docker compose -p "$MARKOS_TEST_COMPOSE_PROJECT" -f infrastructure/compose.m0-test.yml run --rm --no-deps --entrypoint /opt/runtime/.venv/bin/python publisher -c 'import ssl,socket; ctx=ssl.create_default_context(); [(ctx.wrap_socket(socket.create_connection(("rabbitmq",p),5),server_hostname="rabbitmq").close()) for p in (5671,15671)]; print("strict TLS verified")'
      - name: Start synthetic roles
        run: docker compose -p "$MARKOS_TEST_COMPOSE_PROJECT" -f infrastructure/compose.m0-test.yml up -d --no-build --wait --wait-timeout 120 publisher consumer worker review audit-consumer audit-worker audit-review scheduler recovery
      - name: Process, dependency, pressure, daemon and restore faults
        working-directory: services/runtime
        run: uv run --no-sync pytest -q -s tests/integration/test_lifecycle_harness.py
      - name: Record synthetic measurements
        run: cat infrastructure/.test-artifacts/measurements.json
      - name: Capture bounded diagnostics on failure
        if: failure()
        run: |
          docker compose -p "$MARKOS_TEST_COMPOSE_PROJECT" -f infrastructure/compose.m0-test.yml logs --tail 60
          for id in $(docker compose -p "$MARKOS_TEST_COMPOSE_PROJECT" -f infrastructure/compose.m0-test.yml ps -a -q); do docker inspect --format '{{json .State.Health}}' "$id"; done
      - name: Remove only owned synthetic project and volumes
        if: always()
        run: docker compose -p "$MARKOS_TEST_COMPOSE_PROJECT" -f infrastructure/compose.m0-test.yml down -v --remove-orphans
